openapi: 3.1.0
info:
  title: SQL Account Rest API
  version: '1.0'
  description: >
    This is a comprehensive REST API for managing SQL accounts. 
    It provides endpoints for user authentication, customer data management, 
    sales transactions, and stock control. Use this API to integrate your applications 
    with our SQL accounting system.
servers:
  - url: https://sqlaccountingapi.hexasync.dev
tags:
  - name: App
  - name: BizObject
  - name: Customer
  - name: CustomerInvoice
  - name: CustomerPayment
  - name: History
  - name: SalesInvoice
  - name: SalesOrder
  - name: StockAdjustment
  - name: StockItem
  - name: StockItemTemplate
paths:
  /api/app/login:
    post:
      tags:
        - App
      summary: Authenticates a user and retrieves their account info
      description: This endpoint allows users to authenticate with their credentials. If authentication is successful, user information is returned.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Returns application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfoResponse'
              examples:
                default_example:
                  $ref: '#/components/examples/AppInfoGetResponseExample'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/app/info:
    get:
      tags:
        - App
      summary: Retrieves application information
      description: This API returns general information about the application.
      responses:
        '200':
          description: Returns application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfoResponse'
              examples:
                default_example:
                  $ref: '#/components/examples/AppInfoGetResponseExample'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/app/actions:
    get:
      tags:
        - App
      summary: Retrieves available user actions
      description: This endpoint returns a list of actions that users can perform.
      responses:
        '200':
          description: Returns application action names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppActionsResponse'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/app/modules:
    get:
      tags:
        - App
      summary: Retrieves available system modules
      description: This API provides details about the available system modules.
      responses:
        '200':
          description: Returns application module names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppModulesResponse'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/app/biz-objects:
    get:
      tags:
        - App
      summary: Retrieves business objects
      description: This endpoint returns all available business objects in the system.
      responses:
        '200':
          description: Returns application business object names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppBizObjectsResponse'
              examples:
                default_example:
                  $ref: '#/components/examples/BizObjectsGetResponseExample'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/app/biz-objects/{bizObjectName}:
    get:
      tags:
        - App
      summary: Retrieves details of a specific business object
      description: This API returns detailed information about a given business object.
      parameters:
        - name: bizObjectName
          in: path
          description: The name of the business object
          required: true
          style: simple
          schema:
            type: string
            example: AR_CUSTOMER
      responses:
        '200':
          description: Returns application business object details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppBizObjectInfoResponse'
              examples:
                default_example:
                  $ref: '#/components/examples/BizObjectInfoGetResponseExample'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/app/update:
    post:
      tags:
        - App
      summary: Updates the application
      description: This API triggers an update process for the application.
      responses:
        '200':
          description: Returns application update status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUpdateResponse'
              examples:
                default_example:
                  $ref: '#/components/examples/AppUpdateResponseExample'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/biz-objects/query:
    post:
      tags:
        - BizObject
      summary: Executes a query on business objects
      description: This endpoint allows querying business objects using a raw SQL statement with optional parameters.\r\nIt supports pagination via offset and limit.
      requestBody:
        description: Query request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BizObjectQueryRequest'
              examples:
                default_example:
                  $ref: '#/components/examples/BizObjectQueryResponseExample'
      responses:
        '200':
          description: Returns the queried business object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BizObjectQueryResponse'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/biz-objects/{entityType}:
    post:
      tags:
        - BizObject
      summary: Adds a new business object
      description: This endpoint creates a new business object of the specified entity type.\r\nThe request body must contain valid business object data.
      parameters:
        - name: entityType
          in: path
          description: Type of the business object
          required: true
          schema:
            type: string
      requestBody:
        description: Business object data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BizObjectRequest'
      responses:
        '200':
          description: Returns the details of the newly added business object
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                default_example:
                  $ref: '#/components/examples/BizObjectPostResponseExample'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/biz-objects/{entityType}/{fieldKey}/{fieldValue}:
    put:
      tags:
        - BizObject
      summary: Updates an existing business object
      description: This endpoint updates a business object by matching the specified field key and value.\r\nThe request body should contain the updated data.
      parameters:
        - name: entityType
          in: path
          description: The type of business object
          required: true
          schema:
            type: string
        - name: fieldKey
          in: path
          description: Field key used to identify the object
          required: true
          schema:
            type: string
        - name: fieldValue
          in: path
          description: Field value corresponding to the key
          required: true
          schema:
            type: string
      requestBody:
        description: Updated business object data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BizObjectUpdateRequest'
      responses:
        '200':
          description: Returns the updated business object details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                default_example:
                  $ref: '#/components/examples/BizObjectUpdateResponseExample'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/biz-objects/transfer:
    post:
      tags:
        - BizObject
      summary: Transfers a business object from one entity type to another
      description: This endpoint allows transferring a business object from one entity type to another.\r\nIt requires the source entity type, target entity type, and document number for transfer.
      requestBody:
        description: Transfer details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BizObjectTransferRequest'
      responses:
        '200':
          description: Returns the details of the transferred business object
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                default_example:
                  $ref: '#/components/examples/BizObjectTransferResponseExample'
        '400':
          description: General error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/customers/email/{email}:
    get:
      tags:
        - Customer
      summary: Retrieves customers by customer email
      description: This API fetches customers that match the provided customer email.
      parameters:
        - name: email
          in: path
          description: The customer email to search.
          required: true
          style: simple
          schema:
            type: string
            default: ""
            example: delta@ahome.com
        - name: limit
          in: query
          description: "Maximum number of results to return (default: 100)."
          style: form
          schema:
            type: integer
            format: int32
            default: 100
            example: 1
        - name: offset
          in: query
          description: "Offset for pagination (default: 0)."
          style: form
          schema:
            type: integer
            format: int32
            default: 0
            example: 0
      responses:
        '200':
          description: Returns the details of the business object
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
              examples:
                default_example:
                  $ref: '#/components/examples/CustomerInfoResponseExample'
        '400':
